services:
  db:
    image: postgres:17
    container_name: transit-db 
    env_file: .env
    ports:
      - "5432:5432"
    volumes: # volums provide persistent storage 
      - pgdata:/var/lib/postgresql/data      
      - ./sql:/docker-entrypoint-initdb.d    #runs .sql files once on startup 

volumes:
  pgdata: